<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#5fbfff" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Basket Money King</title>
    <meta name="description" content="Basket Money King: a free arcade skill game. Catch falling coins and notes with a net controlled by your hand or by touch. Virtual money only, no betting." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; background: linear-gradient(#5fbfff, #fff6dc); }
      #game { position: relative; z-index: 1; width: 100%; height: 100%; }
      /* Full-screen camera behind the (transparent) game canvas in hand mode. */
      #cam {
        position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover;
        display: none; z-index: 0; background: #000;
      }
      #cam.mirrored { transform: scaleX(-1); }
    </style>
  </head>
  <body>
    <!-- Camera frames are processed on the device only; nothing is recorded or uploaded. -->
    <video id="cam" playsinline muted></video>
    <div id="game"></div>
    <noscript>
      <h1>Basket Money King</h1>
      <p>A free arcade skill game. Catch falling coins and notes with your net. Virtual money only, no betting. Please enable JavaScript to play.</p>
      <p><a href="/about.html">About</a> · <a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms of Use</a></p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
