<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1b1033" />
    <title>Basket King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1033; overflow: hidden; touch-action: none; }
      #game { width: 100%; height: 100%; }
      #cam {
        position: fixed; left: 12px; bottom: 12px; width: 120px; height: 90px;
        border-radius: 12px; border: 2px solid #ffd54a; object-fit: cover;
        transform: scaleX(-1); display: none; z-index: 10; background: #000;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Camera preview. Frames are processed on the device only; nothing is recorded or uploaded. -->
    <video id="cam" playsinline muted></video>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
